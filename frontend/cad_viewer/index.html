<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDTL CAD 2D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#131c28;color:#e5edf6;font:14px system-ui}header{height:58px;display:flex;align-items:center;gap:12px;padding:12px;background:#223144}button,input{font:inherit;background:#293c50;color:#eef5ff;border:1px solid #4a6076;border-radius:5px;padding:8px}button{cursor:pointer}main{display:grid;grid-template-columns:250px minmax(0,1fr) 260px;height:calc(100vh - 58px)}aside{overflow:auto;padding:12px}#viewport{overflow:hidden;position:relative;background:#000;touch-action:none}#drawing{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center;pointer-events:none}label{display:block;padding:4px;overflow-wrap:anywhere}#inventory button{display:block;width:100%;text-align:left;margin:3px 0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#adc3da}#status{margin-left:auto}h3{font-size:14px}
</style><header><strong>SDTL · CAD 2D</strong><input id="file" type="file" accept=".dxf"><button id="fit">Encuadrar</button><button id="apply">Aplicar capas</button><small id="status">Abrir DXF local</small></header>
<main><aside><h3>Capas</h3><div id="layers"></div></aside><section id="viewport"><img id="drawing" alt="Plano CAD"></section><aside><h3>Inventario e inspector</h3><input id="search" placeholder="Texto, capa, handle" style="width:100%"><div id="summary"></div><pre id="properties"></pre><div id="inventory"></div></aside></main>
<script>
const $=id=>document.getElementById(id);let file,doc,blobUrl,zoom=1,x=0,y=0,drag=null,busy=false;
function transform(){$('drawing').style.transform='translate('+x+'px,'+y+'px) scale('+zoom+')'}
function fit(){zoom=1;x=y=0;transform()}$('fit').onclick=fit;
$('viewport').onwheel=e=>{e.preventDefault();const r=e.currentTarget.getBoundingClientRect(),px=e.clientX-r.left-r.width/2,py=e.clientY-r.top-r.height/2;let z=Math.max(.1,Math.min(300,zoom*Math.exp(-e.deltaY*.001)));x=px-(px-x)*z/zoom;y=py-(py-y)*z/zoom;zoom=z;transform()};
$('viewport').onpointerdown=e=>{drag=[e.clientX,e.clientY,x,y];e.currentTarget.setPointerCapture(e.pointerId)};
$('viewport').onpointermove=e=>{if(drag){x=drag[2]+e.clientX-drag[0];y=drag[3]+e.clientY-drag[1];transform()}};
$('viewport').onpointerup=$('viewport').onpointercancel=()=>drag=null;
function inventory(){if(!doc)return;let q=$('search').value.toLowerCase(),matches=doc.entities.filter(e=>[e.entity_id,e.layer,e.entity_type,e.attributes.text,e.properties.block_name].join(' ').toLowerCase().includes(q));$('summary').textContent=matches.length+' entidades · '+doc.units;let root=$('inventory');root.replaceChildren();for(let e of matches.slice(0,200)){let b=document.createElement('button');b.textContent=e.entity_type+' · '+e.layer+' · '+(e.properties.block_name||e.attributes.text||e.entity_id);b.onclick=()=>{$('properties').textContent=JSON.stringify(e,null,2)};root.append(b)}}
$('search').oninput=inventory;
async function load(only=false){if(!file||busy)return;busy=true;$('status').textContent='Procesando…';try{let hidden=only?[...$('layers').querySelectorAll('input:not(:checked)')].map(i=>i.value):[];let res=await fetch('/api/render',{method:'POST',headers:{'X-Hidden-Layers':JSON.stringify(hidden).replace(/[^\x20-\x7e]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')),'X-Render-Only':only?'1':'0'},body:file});let data=await res.json();if(!res.ok)throw Error(data.error);if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(new Blob([data.svg],{type:'image/svg+xml'}));$('drawing').src=blobUrl;fit();if(!only){doc=data.document;$('layers').replaceChildren();$('properties').textContent='';for(let l of doc.layers){let label=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=l.name;i.checked=!l.is_off&&!l.is_frozen;label.append(i,document.createTextNode(l.name));$('layers').append(label)}inventory()}$('status').textContent=file.name}catch(e){$('status').textContent=e.message}finally{busy=false}}
$('file').onchange=e=>{if(busy)return;file=e.target.files[0];load()};$('apply').onclick=()=>load(true);
</script></html>
